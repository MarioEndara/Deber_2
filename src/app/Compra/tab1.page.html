<ion-header>
  <ion-toolbar>
    <ion-title>Compra</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input label="Nombre del producto" labelPlacement="stacked" [(ngModel)]="nombreProducto" placeholder="Ej. Camisa"></ion-input>
  </ion-item>

  <ion-item>
    <ion-input label="Cantidad" labelPlacement="stacked" type="number" [(ngModel)]="cantidad" placeholder="Mayor a 0"></ion-input>
  </ion-item>

  <ion-item>
    <ion-input label="Precio Unitario ($)" labelPlacement="stacked" type="number" [(ngModel)]="precio" placeholder="Mayor a 0"></ion-input>
  </ion-item>

  
  <ion-button expand="block" (click)="procesarCompra()">REGISTRAR Y PAGAR</ion-button>
</ion-content>
